<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MovieVault // Daniel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <div class="header-area">
                <h1>MOVIE<span>VAULT</span></h1>
            </div>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 24px;">Secure Entry Required</p>
            <div id="pinBoxes" class="pin-boxes">
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password" autofocus>
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password">
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password">
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password">
            </div>
            <p id="pinError" class="pin-error"></p>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="header-area"><h1>MOVIE<span>VAULT</span></h1></div>

        <div id="searchDrawer" class="search-drawer">
            <div class="search-outer-wrapper">
                <div class="search-container">
                    <input type="text" id="movieInput" placeholder="Search movies" autocomplete="off">
                    <button id="clearSearch">✕</button>
                </div>
                <div class="content-wrapper">
                    <div id="searchResults"></div>
                </div>
            </div>
        </div>

        <button id="addBtn" onclick="toggleSearch()">＋</button>

        <div id="msg"></div>

        <div class="content-wrapper">
            <nav class="view-tabs">
                <button class="view-tab active" data-view="got" onclick="setView('got')">
                    Got <span class="count-badge" id="gotCount">0</span>
                </button>
                <button class="view-tab" data-view="get" onclick="setView('get')">
                    Get <span class="count-badge" id="getCount">0</span>
                </button>
                <button class="view-tab" data-view="archive" onclick="setView('archive')">
                    Archive <span class="count-badge" id="archiveCount">0</span>
                </button>
            </nav>
        </div>

        <div class="lists-container">
            <section id="view-got" class="view-panel active">
                <div class="content-wrapper">
                    <div class="section-header">
                        <p class="section-hint">On the drive — ready to watch.</p>
                        <div class="sort-container">
                            <button class="sort-btn active" id="sortAlpha" onclick="setSort('title')">A-Z</button>
                            <button class="sort-btn" id="sortYear" onclick="setSort('year')">Date</button>
                            <button class="sort-btn" id="sortRating" onclick="setSort('rating')">Stars</button>
                            <button class="sort-btn" id="sortRuntime" onclick="setSort('runtime')">Runtime</button>
                        </div>
                    </div>
                    <div id="gotList" class="movie-grid"></div>
                </div>
            </section>

            <section id="view-get" class="view-panel">
                <div class="content-wrapper">
                    <div class="section-header">
                        <p class="section-hint">Want to track down — not on the drive yet.</p>
                    </div>
                    <div id="getList" class="movie-grid"></div>
                </div>
            </section>

            <section id="view-archive" class="view-panel">
                <div class="content-wrapper">
                    <div class="section-header">
                        <p class="section-hint">Already watched.</p>
                    </div>
                    <div id="archiveList" class="archive-list"></div>
                </div>
            </section>
        </div>

        <div id="rouletteWrapper" class="roulette-hidden">
            <button id="rouletteBtn" onclick="pickRandomMovie()">
                <span id="rouletteIcon">🎲</span>
                <span id="rouletteText">Pick from what I've got</span>
            </button>
        </div>

        <div id="detailsModal" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <div id="modalData"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
