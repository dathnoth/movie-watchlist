<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MovieVault // Daniel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <div class="header-area">
                <h1>MOVIE<span>VAULT</span></h1>
            </div>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 24px;">Secure Entry Required</p>
            <div id="pinBoxes" class="pin-boxes">
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password" autofocus>
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password">
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password">
                <input class="pin-box" type="password" inputmode="numeric" maxlength="1" pattern="\d*" autocomplete="new-password">
            </div>
            <p id="pinError" class="pin-error"></p>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="projector-beam" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="header-area"><h1>MOVIE<span>VAULT</span></h1></div>

        <div id="searchDrawer" class="search-drawer">
            <div class="search-outer-wrapper">
                <div class="search-container">
                    <input type="text" id="movieInput" placeholder="Search movies" autocomplete="off">
                    <button id="clearSearch">✕</button>
                </div>
                <div class="content-wrapper">
                    <div id="searchResults"></div>
                </div>
            </div>
        </div>

        <div id="msg"></div>

        <div class="lists-container">
            <section id="view-got" class="view-panel active">
                <div class="content-wrapper">
                    <div class="section-header">
                        <h2 class="section-count"><span id="gotCount">0</span> Got</h2>
                        <div class="sort-container" data-list="grid">
                            <button class="sort-btn active" data-sort="title" onclick="setSort('title')">A-Z</button>
                            <button class="sort-btn" data-sort="year" onclick="setSort('year')">Date</button>
                            <button class="sort-btn" data-sort="rating" onclick="setSort('rating')">Stars</button>
                            <button class="sort-btn" data-sort="runtime" onclick="setSort('runtime')">Runtime</button>
                        </div>
                    </div>
                    <div id="gotList" class="movie-grid"></div>
                </div>
            </section>

            <section id="view-get" class="view-panel">
                <div class="content-wrapper">
                    <div class="section-header">
                        <h2 class="section-count"><span id="getCount">0</span> Get</h2>
                    </div>

                    <div id="getList" class="movie-grid"></div>

                    <section id="freshBlock" class="fresh-block">
                        <div class="section-header">
                            <h2 class="section-count fresh-heading"><span id="freshCount">0</span> Fresh Finds</h2>
                        </div>
                        <div class="fresh-filters">
                            <select id="freshYear" class="fresh-filter" onchange="renderFresh()"></select>
                            <select id="freshGenre" class="fresh-filter" onchange="renderFresh()"></select>
                            <select id="freshRuntime" class="fresh-filter" onchange="renderFresh()">
                                <option value="">Any length</option>
                                <option value="0-90">Under 90 min</option>
                                <option value="90-120">90–120 min</option>
                                <option value="120-999">Over 120 min</option>
                            </select>
                            <select id="freshRating" class="fresh-filter" onchange="renderFresh()">
                                <option value="">Any rating</option>
                                <option value="6">6+</option>
                                <option value="7">7+</option>
                                <option value="8">8+</option>
                            </select>
                            <button id="freshReset" class="fresh-filter fresh-reset" onclick="resetFreshFilters()">Reset</button>
                        </div>
                        <div id="freshList" class="fresh-grid"></div>
                        <p class="fresh-credit">Film data from TMDB</p>
                    </section>
                </div>
            </section>

            <section id="view-archive" class="view-panel">
                <div class="content-wrapper">
                    <div class="section-header">
                        <h2 class="section-count"><span id="archiveCount">0</span> Watched</h2>
                        <div class="sort-container" data-list="watched">
                            <button class="sort-btn active" data-sort="watched" onclick="setSort('watched', 'watched')">Recent</button>
                            <button class="sort-btn" data-sort="title" onclick="setSort('title', 'watched')">A-Z</button>
                            <button class="sort-btn" data-sort="year" onclick="setSort('year', 'watched')">Date</button>
                            <button class="sort-btn" data-sort="rating" onclick="setSort('rating', 'watched')">Stars</button>
                            <button class="sort-btn" data-sort="runtime" onclick="setSort('runtime', 'watched')">Runtime</button>
                        </div>
                    </div>
                    <div id="archiveList" class="archive-list"></div>
                </div>
            </section>
        </div>

        <nav class="bottom-bar" aria-label="Library views">
            <div class="bottom-bar-inner">
                <button class="view-tab active" data-view="got" onclick="setView('got')">Got</button>
                <button class="view-tab" data-view="get" onclick="setView('get')">Get</button>
                <button class="view-tab" data-view="archive" onclick="setView('archive')">Watched</button>
            </div>
            <button id="addBtn" onclick="toggleSearch()" aria-label="Search for a movie">
                <svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
                <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                </svg>
            </button>
        </nav>

        <div id="detailsModal" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button class="modal-close" onclick="closeModal()">✕</button>
                <div id="modalData"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
